{% extends 'base.html' %}
{% block title %}Delete Item{% endblock %}
{% block content %}
<div style="max-width:480px;margin:4rem auto;">
<div class="card" style="text-align:center;">
<div style="font-size:3rem;margin-bottom:1rem;">??</div>
<h1 style="font-size:1.25rem;font-weight:700;margin-bottom:0.5rem;">Delete "{{ item.title }}"?</h1>
<p style="color:var(--muted);margin-bottom:1.5rem;">This action cannot be undone.</p>
<form method="post" style="display:flex;gap:0.75rem;justify-content:center;">
{% csrf_token %}
<button type="submit" class="btn btn-danger">Yes, Delete</button>
<a href="{% url 'my_items' %}" class="btn btn-ghost">Cancel</a>
</form>
</div>
</div>
{% endblock %}
