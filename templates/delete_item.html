{% extends 'base.html' %}
{% block title %}Delete Listing{% endblock %}
{% block content %}
<div style="max-width:500px;margin:3rem auto;">
  <div class="card" style="text-align:center;padding:2rem;">
    <div style="font-size:3rem;margin-bottom:1rem;color:var(--color-danger);">⚠️</div>
    <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:0.5rem;color:var(--color-text-primary);">Delete Listing?</h1>
    <p style="color:var(--color-text-secondary);margin-bottom:1.5rem;font-size:0.9rem;">
      Are you sure you want to delete <strong>"{{ item.title }}"</strong>? This action cannot be undone.
    </p>
    <form method="post" style="display:flex;gap:1rem;justify-content:center;">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger" style="flex:1;justify-content:center;">Yes, Delete</button>
      <a href="{% url 'my_items' %}" class="btn btn-ghost" style="flex:1;justify-content:center;">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
