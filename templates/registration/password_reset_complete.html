{% extends "base.html" %}
{% block content %}

<style>
    main {
        position: relative;
        z-index: 1;
        max-width: 480px;
        margin: 0 auto;
        padding: 4rem 1.5rem 6rem;
    }

    .auth-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 20px;
        padding: 3rem 2.5rem 2.5rem;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        text-align: center;
    }

    .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--color-success), #059669);
    }

    .success-ring {
        position: relative;
        width: 84px;
        height: 84px;
        margin: 0 auto 2rem;
        z-index: 1;
    }

    .success-ring svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .success-ring-inner {
        position: absolute;
        inset: 10px;
        background: #DCFCE7;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        color: var(--color-success);
    }

    .auth-title {
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: .5rem;
        color: var(--color-text-primary);
    }

    .auth-subtitle {
        color: var(--color-text-secondary);
        font-size: .9rem;
        line-height: 1.7;
        max-width: 310px;
        margin: 0 auto 2rem;
    }

    .steps-done {
        display: flex;
        flex-direction: column;
        gap: .55rem;
        margin-bottom: 2rem;
        text-align: left;
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 1.1rem 1.25rem;
    }

    .step-item {
        display: flex;
        align-items: center;
        gap: .75rem;
        font-size: .845rem;
        color: var(--color-text-primary);
    }

    .step-check {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #DCFCE7;
        border: 1px solid #86EFAC;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: .65rem;
        color: var(--color-success);
        font-weight: 700;
    }

    .step-label {
        flex: 1;
    }

    .step-done-tag {
        font-size: .65rem;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--color-success);
        background: #DCFCE7;
        border: 1px solid #86EFAC;
        padding: .12rem .5rem;
        border-radius: 999px;
    }

    .btn-login {
        display: inline-flex;
        align-items: center;
        gap: .5rem;
        background: var(--color-primary);
        border: none;
        color: #ffffff;
        padding: .85rem 2.5rem;
        border-radius: 10px;
        width: 100%;
        justify-content: center;
        font-size: .95rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        transition: background-color .2s;
    }

    .btn-login:hover {
        background: var(--color-primary-dark);
        color: #ffffff;
    }

    .card-footer-hint {
        margin-top: 1.25rem;
        font-size: .78rem;
        color: var(--color-text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: .35rem;
    }

    .card-footer-hint a {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 500;
    }
</style>

<main>
    <div class="auth-card">

        <div class="success-ring">
            <svg viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="42" cy="42" r="40" stroke="#86EFAC" stroke-width="2" />
            </svg>
            <div class="success-ring-inner">✓</div>
        </div>

        <div class="auth-title">Password changed!</div>
        <p class="auth-subtitle">
            Your password has been updated successfully. You can now sign in with your new credentials.
        </p>

        <div class="steps-done">
            <div class="step-item">
                <div class="step-check">✓</div>
                <span class="step-label">Reset link requested</span>
                <span class="step-done-tag">done</span>
            </div>
            <div class="step-item">
                <div class="step-check">✓</div>
                <span class="step-label">Link verified</span>
                <span class="step-done-tag">done</span>
            </div>
            <div class="step-item">
                <div class="step-check">✓</div>
                <span class="step-label">New password set</span>
                <span class="step-done-tag">done</span>
            </div>
        </div>

        <a href="{% url 'login' %}" class="btn-login">
            Log in now →
        </a>

        <div class="card-footer-hint">
            Trouble signing in?
            <a href="{% url 'login' %}">Sign in options</a>
        </div>

    </div>
</main>

{% endblock %}
