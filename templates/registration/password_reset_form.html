{% extends "base.html" %}
{% block content %}

<style>
    main {
        position: relative;
        z-index: 1;
        max-width: 480px;
        margin: 0 auto;
        padding: 4rem 1.5rem 6rem;
    }

    .auth-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 20px;
        padding: 2.75rem 2.25rem 2.25rem;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--color-primary);
    }

    .auth-icon {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        background: var(--color-primary-light);
        border: 1px solid rgba(29, 78, 216, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
    }

    .auth-title {
        font-size: 1.55rem;
        font-weight: 800;
        margin-bottom: .4rem;
        color: var(--color-text-primary);
    }

    .auth-subtitle {
        color: var(--color-text-secondary);
        font-size: .875rem;
        line-height: 1.65;
        margin-bottom: 2rem;
    }

    .form-wrap p {
        margin-bottom: 1.1rem;
    }

    .form-wrap p label {
        display: block;
        font-size: .75rem;
        font-weight: 700;
        color: var(--color-text-secondary);
        margin-bottom: .35rem;
        text-transform: uppercase;
    }

    .form-wrap p input[type="email"] {
        width: 100%;
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        border-radius: 99px;
        padding: .72rem 1rem;
        color: var(--color-text-primary);
        font-size: .9rem;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
    }

    .form-wrap p input[type="email"]:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
    }

    .btn-submit {
        width: 100%;
        background: var(--color-primary);
        border: none;
        color: #ffffff;
        padding: .8rem 1rem;
        border-radius: 10px;
        font-size: .95rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: .25rem;
        transition: background-color .2s;
    }

    .btn-submit:hover {
        background: var(--color-primary-dark);
    }

    .auth-back {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: .35rem;
        margin-top: 1.4rem;
        font-size: .82rem;
        color: var(--color-text-secondary);
    }

    .auth-back a {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 600;
    }
</style>

<main>
    <div class="auth-card">

        <div class="auth-icon">🔑</div>

        <div class="auth-title">Forgot password?</div>
        <p class="auth-subtitle">
            Enter the email linked to your account and we'll send you a reset link right away.
        </p>

        <form method="POST" class="form-wrap">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">
                Send Reset Link →
            </button>
        </form>

        <div class="auth-back">
            Remember your password?
            <a href="{% url 'login' %}">Log in</a>
        </div>

    </div>
</main>

{% endblock %}
